ServerName ssp.dev.openconext.local

# Send the (main server) error log through tee: it still goes to stderr, so it shows up in
# `docker compose logs`, and is also written to /var/log/devssp/error.log so the functional
# tests (see tests/) can check that a test did not cause any errors.
# SimpleSAMLphp logs to stderr ('logging.handler' => 'stderr'), PHP errors go here as well.
ErrorLog "|/usr/bin/tee -a /var/log/devssp/error.log"

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    # This is a development container. The base image enables mod_expires globally
    # (ExpiresByType text/css "access plus 1 year" etc.), which would add a one-year
    # max-age/Expires to all responses and make browsers keep serving stale SimpleSAMLphp
    # module assets (CSS/JS) after theme changes. Disable it here: assets are served with
    # max-age=0 + ETag (see 'assets.caching' in config.php), so browsers revalidate on every
    # request and get the current file.
    ExpiresActive Off
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    DirectoryIndex disabled
    DirectoryIndex index.php index.html
    # The standard devssp IdP
    Alias /simplesaml /var/www/simplesaml/public/
    # The EntraID mock IdP
    Alias /entra-mock /var/www/simplesaml/public/
    <Directory /var/www/simplesaml/public>
       Require all granted
    </Directory>
</VirtualHost>
